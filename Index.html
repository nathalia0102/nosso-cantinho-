<script>
      const START_DATE = new Date('2024-05-12T00:00:00');
      const STORAGE_KEY = 'nosso_cantinho_recados';
      let selectedAuthor = 'Nathália';

      function updateTimer() {
        const now = new Date();
        const diff = Math.max(0, now - START_DATE);
        document.getElementById('days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById('hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
        document.getElementById('minutes').textContent = Math.floor((diff / (1000 * 60)) % 60);
        document.getElementById('seconds').textContent = Math.floor((diff / 1000) % 60);
      }
      updateTimer();
      setInterval(updateTimer, 1000);

      document.querySelectorAll('.author-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          selectedAuthor = btn.dataset.author;
          document.querySelectorAll('.author-btn').forEach((b) => {
            const active = b.dataset.author === selectedAuthor;
            b.className = active
              ? 'author-btn flex-1 py-2 rounded-xl text-sm font-medium transition bg-rose-500 text-white shadow-sm'
              : 'author-btn flex-1 py-2 rounded-xl text-sm font-medium transition bg-rose-50 text-rose-700 hover:bg-rose-100';
          });
        });
      });

      function renderNotes() {
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const list = document.getElementById('notesList');
        if (notes.length === 0) {
          list.innerHTML = '<p class="text-center text-sm text-rose-400 py-6">Ainda não há recadinhos aqui. Escrevam o primeiro! ❤️</p>';
          return;
        }
        list.innerHTML = notes
          .map(
            (n) => 
            <div class="rounded-2xl bg-rose-50/80 border border-rose-100 p-3.5">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-bold text-rose-700">${n.author}</span>
                <span class="text-xs text-rose-400">❤️</span>
              </div>
              <p class="text-sm text-rose-950 break-words">${n.text}</p>
            </div>
          )
          .join('');
      }

      document.getElementById('noteForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('noteInput');
        const text = input.value.trim();
        if (!text) return;
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        notes.unshift({ author: selectedAuthor, text });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        input.value = '';
        renderNotes();
      });

      renderNotes();
    </script>
  </body>
</html>
